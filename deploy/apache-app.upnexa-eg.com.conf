# Apache vhost for the Expo web app (admin/client/tech in browser).
# Static files from /var/www/fanni-web (output of: expo export --platform web).
# Keep api.upnexa-eg.com proxied to PM2. Do not Alias /var/www/storage/fanni.

<VirtualHost *:443>
  ServerName app.upnexa-eg.com

  DocumentRoot /var/www/fanni-web
  <Directory /var/www/fanni-web>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    FallbackResource /index.html
  </Directory>

  SSLEngine on
  RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
