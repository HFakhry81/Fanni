# Nginx vhost for Expo web app (Fanni) at app.upnexa-eg.com
# DocumentRoot must be the output of:
#   pnpm --filter @workspace/mobile exec expo export --platform web --output-dir dist-web
# synced to /var/www/fanni-web
#
# Keep API on api.upnexa-eg.com → proxy_pass http://127.0.0.1:5000
# Do NOT expose /var/www/storage/fanni publicly.

server {
    listen 80;
    listen [::]:80;
    server_name app.upnexa-eg.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.upnexa-eg.com;

    # Adjust paths to your Let's Encrypt / certbot layout
    ssl_certificate     /etc/letsencrypt/live/app.upnexa-eg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.upnexa-eg.com/privkey.pem;

    root /var/www/fanni-web;
    index index.html;

    # APK — must be a real file, not Expo SPA fallback
    location = /fanni.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="fanni.apk"' always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /fanni.apk =404;
    }

    # Expo static assets (hashed JS/CSS)
    location /_expo/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA fallback — required for Expo Router deep links (/welcome, /(client)/home, …)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (tighten as needed)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;
}
