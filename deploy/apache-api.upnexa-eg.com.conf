# Apache vhost fragment for api.upnexa-eg.com (Let's Encrypt already in use).
# Proxy Node/PM2 on 127.0.0.1:5000. Requires: proxy, proxy_http, proxy_wstunnel, rewrite, ssl, headers.

<VirtualHost *:443>
  ServerName api.upnexa-eg.com

  SSLEngine on
  # SSLCertificateFile / etc paths are already on the VPS — keep existing cert lines.

  RequestHeader set X-Forwarded-Proto "https"
  ProxyPreserveHost On
  ProxyRequests Off

  RewriteEngine On
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteCond %{HTTP:Connection} upgrade [NC]
  RewriteRule ^/?(.*) ws://127.0.0.1:5000/$1 [P,L]

  ProxyPass / http://127.0.0.1:5000/
  ProxyPassReverse / http://127.0.0.1:5000/

  # Private KYC files are served only via authenticated /api/uploads/file — do not Alias them public.
</VirtualHost>
